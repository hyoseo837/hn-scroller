<meta charset="utf-8">
<title>HN Scroller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS ignores the manifest for home-screen installs and reads these instead. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HN">
<link rel="stylesheet" href="app.css">

<!-- One stroke weight, drawn here once and referenced by <use>. -->
<svg hidden>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-cmt" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1.4-4.4a8.5 8.5 0 1 1 15.6-4.6z"/></symbol>
  <symbol id="i-glo" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 2-2h12v15H7a2 2 0 0 0-2 2z"/><path d="M5 20a2 2 0 0 0 2 2h12v-4M9 7.5h6"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M8 16 16.5 7.5M9 7h8v8"/></symbol>
</svg>

<div class="phone">
  <div class="bar">
    <span class="brand">HN Scroller</span>
    <button id="cal" aria-label="Past days"><svg class="ico"><use href="#i-cal"/></svg><span id="date">—</span></button>
    <!-- One <option> per language; each also needs its strings in js/i18n.js and data/<date>.<code>.json. -->
    <select id="lang" aria-label="Language"><option value="en" lang="en">ENG</option><option value="ko" lang="ko">KOR</option></select>
    <span class="pos" id="pos"></span>
    <span class="dots" id="dots"></span>
  </div>

  <main id="feed"><div class="empty">Loading…</div></main>

  <div class="acts">
    <span class="hint" id="hint"></span>
    <button id="btn-cmt" disabled><svg class="ico"><use href="#i-cmt"/></svg><span>—</span></button>
    <button id="btn-glo" disabled><svg class="ico"><use href="#i-glo"/></svg><span>—</span></button>
  </div>

  <div id="scrim"></div>
  <section id="sheet" hidden></section>
</div>

<!-- Classic scripts sharing one global scope, not modules: base first, boot last. -->
<script src="js/base.js"></script>
<script src="js/i18n.js"></script>
<script src="js/render.js"></script>
<script src="js/nav.js"></script>
<script src="js/keys.js"></script>
<script src="js/sheets.js"></script>
<script src="js/back.js"></script>
<script src="js/boot.js"></script>
