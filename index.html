<meta charset="utf-8">
<title>HN Scroller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #16161a;
    --dim: #6b6b76;
    --line: #e2e0da;
    --accent: #ff6600; /* HN orange */
    --sheet: #ffffff;
    --outside: #d9d7d1; /* desktop surround, outside the phone */
    --mark: rgba(255, 138, 51, .42);
    --tint: rgba(255, 102, 0, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f10;
      --fg: #f2f1ee;
      --dim: #9a9aa4;
      --line: #2a2a2e;
      --sheet: #17171a;
      --outside: #000;
      --mark: rgba(255, 122, 26, .34);
      --tint: rgba(255, 138, 51, .10);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--outside);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    display: grid;
    place-items: center;
  }

  /* The phone. Full bleed on a real phone, a centred column everywhere else —
     which is how Reels and Shorts behave on desktop. All chrome positions
     against THIS, not the viewport, or it would cling to the browser window. */
  .phone {
    position: relative;
    isolation: isolate;
    width: 100%;
    max-width: 430px;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
  }
  @media (min-width: 481px) {
    .phone {
      height: min(100dvh - 40px, 932px); /* 430x932 = iPhone 15 Pro Max */
      border-radius: 30px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .34), 0 0 0 1px rgba(0, 0, 0, .06);
    }
  }

  /* vertical axis: one post per screen */
  #feed {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }
  #feed.locked { overflow-y: hidden; }

  /* horizontal axis: depth within one post */
  .post {
    height: 100%;
    scroll-snap-align: start;
    display: flex;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  .post::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 100%;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 84px 22px 132px;
    min-width: 0;
  }
  /* The glance layer is the biggest: it is the only one most readers ever see. */
  /* Display text wants tighter leading; body text wants looser. */
  .simple { font-size: clamp(27px, 7vw, 34px); font-weight: 680; letter-spacing: -0.022em; line-height: 1.2; margin: 0; }
  .headline { font-size: clamp(20px, 5.2vw, 24px); font-weight: 600; letter-spacing: -0.012em; line-height: 1.34; margin: 0; }
  .substance { font-size: 17px; line-height: 1.62; margin: 0; }

  .hero { margin-bottom: 22px; border-radius: 14px; overflow: hidden; background: var(--line); aspect-ratio: 16 / 9; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Marker-pen highlight: reads as emphasis at any weight, unlike bold inside bold. */
  strong { font-weight: 750; background: linear-gradient(transparent 58%, var(--mark) 58%); }
  .from { color: var(--dim); font-size: 14px; margin-top: 18px; }
  .kicker { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px; }
  .data { margin-top: 20px; border-top: 1px solid var(--line); font-size: 15px; }
  .data div { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .data span:first-child { color: var(--dim); }
  .src { font-size: 15px; word-break: break-word; }
  .src a { color: var(--accent); display: inline-block; margin-bottom: 14px; }
  .src .host { color: var(--dim); display: block; margin-bottom: 26px; font-size: 14px; }

  /* chrome — absolute against .phone */
  .bar {
    position: absolute; inset: 0 0 auto 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: max(14px, env(safe-area-inset-top)) 18px 12px;
    font-size: 13px; color: var(--dim);
    background: linear-gradient(var(--bg) 62%, transparent);
    pointer-events: none;
  }
  .bar button { font: inherit; color: inherit; background: none; border: 0; padding: 4px 0; cursor: pointer; pointer-events: auto; }
  .dots { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .18s; }
  .dots i.on { background: var(--accent); }

  .acts {
    position: absolute; inset: auto 0 0 0; z-index: 3;
    display: flex; gap: 10px; align-items: center;
    padding: 12px 18px max(18px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 42%);
  }
  .acts button {
    font: inherit; font-size: 14px; color: var(--fg);
    background: var(--sheet); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 15px; cursor: pointer;
  }
  .acts button:disabled { opacity: .35; }
  .hint { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; }

  /* sheet — also absolute, so it rises inside the phone */
  #sheet {
    position: absolute; inset: auto 0 0 0; z-index: 5;
    max-height: 82%; overflow-y: auto;
    background: var(--sheet); border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px max(24px, env(safe-area-inset-bottom));
    transform: translateY(101%); transition: transform .24s ease;
  }
  #sheet.open { transform: none; }
  #scrim { position: absolute; inset: 0; z-index: 4; background: #000; opacity: 0; pointer-events: none; transition: opacity .24s; }
  #scrim.open { opacity: .45; pointer-events: auto; }
  #sheet h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  /* The camps line is a summary, not a comment — it must not look like one. */
  #sheet .camps { background: var(--tint); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 13px 15px; margin-bottom: 4px; }
  #sheet .camps-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin-bottom: 5px; }
  #sheet .camps p { margin: 0; font-size: 15px; line-height: 1.55; }
  #sheet .cmt { border-top: 1px solid var(--line); padding: 16px 0 6px; }
  #sheet .cmt p { margin: 0; font-size: 15.5px; line-height: 1.62; }
  #sheet .who { font-size: 12.5px; font-weight: 650; color: var(--dim); margin-bottom: 6px; }
  #sheet .cmt a { color: var(--accent); }
  #sheet dl { margin: 0; }
  #sheet dt { font-weight: 640; margin-top: 14px; }
  #sheet dd { margin: 4px 0 0; color: var(--dim); }
  #sheet .days { display: flex; flex-wrap: wrap; gap: 8px; }
  #sheet .days a { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; text-decoration: none; color: var(--fg); font-size: 14px; }
  #sheet .days a.now { border-color: var(--accent); color: var(--accent); }

  .end { text-align: center; }
  .end h1 { font-size: 27px; margin: 0 0 8px; }
  .end p { color: var(--dim); margin: 0; }
  .empty { padding: 30px 22px; color: var(--dim); }
</style>

<div class="phone">
  <div class="bar">
    <button id="cal">📅 <span id="date">—</span></button>
    <span class="dots" id="dots"></span>
  </div>

  <main id="feed"><div class="empty">Loading…</div></main>

  <div class="acts">
    <button id="btn-cmt" disabled>💬 —</button>
    <button id="btn-glo" disabled>📖 —</button>
    <span class="hint" id="hint"></span>
  </div>

  <div id="scrim"></div>
  <section id="sheet" hidden></section>
</div>

<script src="app.js"></script>
