name: daily edition

on:
  schedule:
    # 00:00 UTC — captures a full US day and lands ~09:00 KST. GitHub runs
    # scheduled jobs late by 10-30 min, which is harmless for a daily edition.
    - cron: "0 0 * * *"
  workflow_dispatch: {}

# Never let a slow run overlap the next day's: the second would re-select the
# same posts before the first had written published.json.
concurrency:
  group: daily-edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only, so there is nothing to install.
      - name: Self-check
        run: python3 generate.py --check

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 generate.py

      - name: Commit the edition
        run: |
          git config user.name "hn-scroller"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Nothing new is a normal outcome, not a failure.
          git diff --staged --quiet && echo "no new cards" && exit 0
          git commit -m "cards for $(date -u +%F)"
          git push
