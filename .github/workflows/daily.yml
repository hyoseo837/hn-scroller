name: edition

on:
  schedule:
    # Every 6h. Dedup means the same ~24 posts/day are processed either way, so
    # this costs nothing extra and a failed run goes stale for 6h, not 24. Safe
    # on thread maturity because the 200-point threshold already gates age:
    # of 158 qualifying stories in a week, one was under 6h old, and it had 116
    # comments. GitHub runs scheduled jobs 10-30 min late, which is harmless.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

# Never let a slow run overlap the next day's: the second would re-select the
# same posts before the first had written published.json.
concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only, so there is nothing to install.
      - name: Self-check
        run: python3 -m generate --check

      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -m generate

      - name: Commit the edition
        run: |
          git config user.name "hn-scroller"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Nothing new is a normal outcome, not a failure.
          git diff --staged --quiet && echo "no new cards" && exit 0
          git commit -m "cards for $(date -u +%F)"
          git push
